<!DOCTYPE html><html><head lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Playlists Forever</title></head>
<style>
  body, html {
    background-color:rgba(0,126,255,1);
  } 
  .content li {
    list-style:none;
  }
  audio::-webkit-media-controls-panel {
    background-color:rgba(0,126,255,1);
  }
  #containerOne {
    display:flex;
    flex-direction:column;
    background-color:Red;
  }
  #containerTwo {
    display:flex;
    flex-direction:column;
    background-color:Purple;
  }
  #funk {
    font-weight:30px;
    color:rgb(100,149,237);
  }
  #soul {
    font-weight:30px;
    color:rgb(0,163,108);
  }
</style>
<body>
  <h1><strong>Genres are color coded. A mix of colors in the container indicates a mix of genres</strong></h1>
  <ul>
    <li id="funk">Funk</li>
    <li id="soul">Soul</li>
  </ul>
  <div id="containerOne">
    <div><ul><li><h1>Genre</h1></li><li><h3>Artist</h3></li><li><h4>Song Title</h4></li></ul></div>
    <div><audio class="song" controls><source src="1985.mp3"></audio></div>
  </div>
  <div id="containerTwo">
    <div><h1>Genre!</h1></div>
    <div><h3>Artist!</h3></div>
    <div><h4>Song Title!</h4></div>
    <div><audio class="song" controls><source src="Abidjan.mp3"></audio></div>
  </div>
</body>
<script>
  const songs = [...document.querySelectorAll('.song')];

  songs.forEach(song => song.ontimeupdate = nextSong);

  function nextSong(e) {

    const end = this.duration;

    let now = this.currentTime;

    if (end <= now) {

      const position = songs.indexOf(this);

      if (position === songs.length - 1) {
        songs[0].play();

      } else {
        songs[position + 1].play();
      }
    }
  }
</script>
</html>
