<!DOCTYPE html><html><head lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Playlists Forever</title></head>
<style>
  body, html {
    background-color:rgba(0,126,255,1);
  } 
  audio::-webkit-media-controls-panel {
    background-color:rgba(0,126,255,1);
  }
  #containerOne {
    display:flex;
    flex-direction:column;
    background-color:Red;
  }
  #containerTwo {
    display:flex;
    flex-direction:column;
    background-color:Purple;
  }
</style>
<body>
  <div class="song" id="containerOne">
    <div><h1>Genre!</h1></div>
    <div><h3>Artist!</h3></div>
    <div><h4>Song Title!</h4></div>
    <div><audio controls><source src="1985.mp3"></audio></div>
  </div>
  <div class="song" id="containerTwo">
    <div><h1>Genre!</h1></div>
    <div><h3>Artist!</h3></div>
    <div><h4>Song Title!</h4></div>
    <div><audio controls><source src="Abidjan.mp3"></audio></div>
  </div>
</body>
<script>
  const songs = [...document.querySelectorAll('.song')];

  songs.forEach(song => song.ontimeupdate = nextSong);

  function nextSong(e) {

    const end = this.duration;

    let now = this.currentTime;

    if (end <= now) {

      const position = songs.indexOf(this);

      if (position === songs.length - 1) {
        songs[0].play();

      } else {
        songs[position + 1].play();
      }
    }
  }
</script>
</html>
