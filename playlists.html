<!DOCTYPE html><html><head lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Playlists Forever</title></head>
<style>
  body, html {
    background-color:rgba(0,126,255,1);
  } 
  #pencegenc audio::-webkit-media-controls-panel {
    background-color:rgba(0,126,255,1);
  }
  #nineteen audio::--webkit-media-controls-panel {
    background-color:Red;
  }
</style>
<body>
  <h2>Genre</h2>
  <h4>Artist</h4>
  <p>Song title</p>
  <audio class="song" id="nineteen" controls>
    <source src="1985.mp3">
  </audio>
</br>
   <audio class="song" id='pencegenc' controls>
     <source src="50PenceGenc.mp3">
   </audio>
</body>
<script>
  const songs = [...document.querySelectorAll('.song')];

  songs.forEach(song => song.ontimeupdate = nextSong);

  function nextSong(e) {

    const end = this.duration;

    let now = this.currentTime;

    if (end <= now) {

      const position = songs.indexOf(this);

      if (position === songs.length - 1) {
        songs[0].play();

      } else {
        songs[position + 1].play();
      }
    }
  }
</script>
</html>
