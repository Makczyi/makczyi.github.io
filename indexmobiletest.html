<!DOCTYPE html><html><head lang="en"><meta name="viewport"><meta content="device=device-width, initial-scale=1.0">
  <body>
    <div class="ab-07">
    <button class="ab-07__btn">Enhance this song with AI</button>
   </div>
</body>
    <style>
      .ab-07__btn {
        width:350px;
        height:50px;
      }
      .ab-07,
      .ab-07 *,
      .ab-07 *::before,
      .ab-07 *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
}
.ab-07__btn {
  display: inline-block;
  padding: .9rem 2.4rem;
  font-size: 1rem;
  font-weight: 800;
  color: #fff;
  background: linear-gradient(90deg,#7c3aed,#06b6d4,#f43f5e,#7c3aed);
  background-size: 300% 300%;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  outline: none;
  letter-spacing: .03em;
  animation: ab-07-shift 2s ease infinite;
  will-change: background-position;
  box-shadow: 0 4px 20px rgba(124,58,237,.4);
  transition: filter .2s,box-shadow .2s,transform .15s;
  align:center;
  bottom:0px;
}

.ab-07__btn:hover {
  filter: brightness(1.12);
  box-shadow: 0 6px 32px rgba(124,58,237,.6);
  transform: translateY(-2px);
}

.ab-07__btn:active {
  transform: translateY(0);
  filter: brightness(.95);
}

@keyframes ab-07-shift {
  0% {
    background-position: 0% 50%;
  }

  50% {
    background-position: 100% 50%;
  }

  100% {
    background-position: 0% 50%;
  }
}
body, html {
  background-color:black;
}

@media (prefers-reduced-motion: reduce) {
  .ab-07__btn {
    animation: none;
    background: linear-gradient(90deg,#7c3aed,#06b6d4);
  }
}
@media screen and (max-width:570px) {
  .ab-07__btn {
    width:40%;
    height:20%;
  }
}
</style>
</head>
</html>
