<!DOCTYPE html><html><head lang="en"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script></script>
  <title>Testing Forever</title>
 <body>
   <div class="ab-07">
     <button class="ab-07__btn">Enhance this song with AI</button>
  </div>
 </body>
  <style>
    body, html {
      background-color:black;
    }
.ab-07 {
  font-family: system-ui,sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: right;
  justify-content: center;
}
.ab-07__btn {
  display: inline-block;
  padding: .9rem 2.4rem;
  font-size: 1rem;
  font-weight: 800;
  color: #fff;
  background: linear-gradient(90deg,#7c3aed,#06b6d4,#f43f5e,#7c3aed);
  background-size: 300% 300%;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  outline: none;
  letter-spacing: .03em;
  animation: ab-07-shift 4s ease infinite;
  will-change: background-position;
  box-shadow: 0 4px 20px rgba(124,58,237,.4);
  transition: filter .2s,box-shadow .2s,transform .15s;
}

.ab-07__btn:hover {
  filter: brightness(1.12);
  box-shadow: 0 6px 32px rgba(124,58,237,.6);
  transform: translateY(-2px);
}

.ab-07__btn:active {
  transform: translateY(0);
  filter: brightness(.95);
}

@keyframes ab-07-shift {
  0% {
    background-position: 0% 50%;
  }

  50% {
    background-position: 100% 50%;
  }

  100% {
    background-position: 0% 50%;
  }
}

@media (prefers-reduced-motion: reduce) {
  .ab-07__btn {
    animation: none;
    background: linear-gradient(90deg,#7c3aed,#06b6d4);
  }
}
  </style>
</head>
</html>
