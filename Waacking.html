<!DOCTYPE html><html><head lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Waacking Forever</title>
   <style>
     .collapsible {
       background-color:#777;
       color:white;
       cursor:pointer;
       padding:18px;
       width:100%;
       border:none;
       text-align:left;
       outline:none;
       font-size:15px;
     }
     .active, .collapsible:hover {
       background-color:#555;
     }
     .content {
       padding:0 18px;
       max-height:0;
       overflow:hidden;
       transition:max-height 0.2s ease-out;
       background-color:#f1f1f1;
     }
    body, html {
      background:repeating-radial-gradient(ellipse, #352514 97%, #00FF00 100%);
      background-size: cover;
      height:100%;
    }
  </style>
</head>
<body>
  <h2>Animated Collapsibles</h2>

  <p>A Collapsible:</p>
  <button class="collapsible">Funk / Soul</button>
  <div class="content">
    <img id="albumCover"src="KayGees.png"alt="albumCover"><li id="artist"><b>The Kay Gees</b></li><li id="songTitle">Kay Gees Theme Song</li><audio controls><source src="KayGees.mp3"></audio>
  </div>
    
    <img src="DJCooper.png" alt="DJCooper" id="Cooper" style=float:right;max-width:80%;max-height:100%;top:5px;position:sticky;>
  
  <script>
    var coll = document.getElementByClassName("collapsible");
    var i;

    for (i = 0; i <coll.length; i++) {
      coll[i].addEventListener("click", funtion() {
        this.classList.toggle("active");
        var content = this.nextElementSibling;
        if (content.style.maxHeight){
          content.style.maxHeight = null;
        } else {
          content.style.maxHeight = content.scrollHeight + "px";
        }
      });
    }
  </script>
</body>
</html>
