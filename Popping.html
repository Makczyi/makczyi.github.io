<!DOCTYPE html><html><head lang="en"<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Popping Forever</title>
<body>
  <img src="DJNuri.png" alt="DJNuri" id="Nuri" style=float:right;width:400px;top:5px;position:sticky;> 
<button type="button" class="collapsible">Funk / Soul></button>
  <div class="content">
    <img id="albumCover"src="TakeMeWithU.png"alt="albumCover"><li id="artist"><b>Sharon Jones & The Dap Kings</b></li><li id="songTitle"><b>Take Me With U</b></li><audio controls><source src="TakeMeWithU.mp3"></audio>
  </div>  
</body>
  <style>
    body, html {
      background:repeating-radial-gradient(ellipse, #330415 97%, #F0F0F0 100%);
      background-size:cover;
      background-repeat: repeat;
    }
    #albumCover {
      width:250px;
      height:230px;
    }
    #artist {
      background-color: darkblue;
      color: white;
      font-size:40px;
      font-weight:50%;
      width:350px;
    }
    #songTitle {
      background-color:darkblue;
      color:white;
      font-soze:30px;
      font-weight:50%;
      width:350px;
    }

    .collapsible {
      background-color:maroon;
      color:white;
      cursor: pointer;
      padding:18px;
      width: 50%;
      border:none;
      text-align:left;
      outline:none;
      font-size: 15px;
      position: absolute;
      left:10px;
      top:250px;
    }
  </style>
  <script>
    var coll = document.getElementsByClassName("collapsible");
    var i;

    for (i= 0; i < coll.length; i++) {
      coll[i].addEventListener("click", function() {
        this.classList.toggle("active");
        var content = this.nextElementSibling;
        if (content.style.display == "block") {
          content.style.display = "none";
        } else {
          content.style.display = "block";
        }
      });
    }
  </script>
</html>
