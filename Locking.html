<!DOCTYPE html><html><head lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Locking Forever</title>
<body>
  <img src="DJMason.png" alt="MasonDJ" class="Mason" style=float:right;width:100%;top:5px;position:sticky;>
</body>
<style>
  body, html {
    background:repeating-radial-gradient(ellipse, #330413 97%, #FF0000 100%);
    background-size:cover;
    height:100%;
  }
  #genre {
    background-color:darkblue;
    color:white;
    font-size:50px;
    font-weight:85%;
    max-width:40px;
  }
  #subgenre {
    background-color: rgb(112, 41, 99);
    color:white;
    font-size:30px;
    font-weight:85%;
    max-width:30px;
  }
  #albumCover {
    width:250px;
    height:230px;
  }
  #artist {
    background-color:darkblue;
    color:white;
    font-size:40px;
    font-weight:60%;
    max-width:350px;
  }
   #songTitle {
    background-color:darkblue;
    color:white;
    font-size:30px;
    font-weight:50%;
    margin-bottom:5px;
    max-width:350px;
  }
  @media only screen and (max-width:100%;) {
    .album, .Mason {
      width:100%;
    }
  }
</style>
  <body>
   <div class="album">
     <h1 id="genre">Funk</h1>
     <h2 id="subgenre">Funk / Soul</h2>
     <img style=width:100%; id="albumCover" src="KayGees.png" alt="albumCover">
     <li id="artist"><b>The Kay Gees</b></li>
     <li id="songTitle">Kay Gees Theme Song</li>
     <audio controls><source src="KayGees.mp3"></audio>
   </div>
  </body>
</html>
