<!DOCTYPE html><html><head lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Vinyl Forever</title>
  <body>
      <img src="SushBackground.png" alt="KittyDJ" id="kitty" style=float:right; max-width:80%;max-height:100%;top:5px;position:sticky;>
  </body>
    <style>
       body, html {
            background:repeating-radial-gradient(ellipse, #682503 97%, #FF00FF 100%);
            background-size:cover;
            background-repeat:repeat;
            height:100%
        }
      * {
        margin:0;
        padding:0;
      }
      .content li {
        ;ost-style:none;
      }
      .collapsible {
        background-color:maroon;
        color:navy;
        cursor:pointer;
        padding:18px;
        width:800px;
        border:none;
        text-align:none;
        outline:none;
        font-size:15px;
        top:200px;
      }
      .active, .collapsible:hover {
        background-color:navy;
      }
      .content {
        padding: 0 18px;
        max-height:0;
        width:350px;
        overflow:hidden;
        transition:max-height 0.2s ease-out;
        background-color:rgb(112, 41, 99);
      }
      .subgenre {
        background-color:rgb(12, 41, 99);
        color:white;
        font-size:30px;
        font-weight:85%;
        height:100px;
        width:400px;
      }
      #albumCover {
        width:250px;
        height:230px;
      }
      #artist {
        color:white;
        font-size:40px;
        font-weight:60%;
        width:350px;
      }
      #songTitle {
        color:white;
        font-size:30px;
        font-weight:50%;
        margin-bottom:5px;
        width:350px;
      }
    </style>
</head>
  <body>
    <button class="subgenre">Electronic/Hip Hop</button>
     <div class="content">
       <img id="albumCover"src="Mothership.png"alt="albumCover"><li id="artist"><b>Portformat (opolopo Remix</b></li><li id="songTitle">Mothership</li><audio controls><source src="Mothership.mp3"></audio><li></li><img id="albumCover"src="SlowMotion.png"alt="albumCover"><li id="artist"><b>E. Live</b></li><li id="songTitle">Slow Motion</li><audio controls><source src="SlowMotion.mp3"></audio>
     </div>
    <script>
      var coll = document.getElementsByClassName("subgenre");
      var i;

      for (i = 0; i < coll.length; i++) {
        coll[i].addEventListener("click", function() {
          this.classList.toggle("active");
          var content = this.nextElementSibling;
          if (content.style.maxHeight){
            content.style.maxHeight = null;
          } else {
            content.style.maxHeight = content.scrollHeight + "px";
          }
        });
      }    
    </script>
  </body>
</html>
